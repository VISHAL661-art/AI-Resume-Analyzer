spring.application.name=ai-resume-analyzer
server.port=9090

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/resume_analyzer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# File Upload Configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=9a2f8c4e7b1d3a5f8e6c4b2a9f7e1d3c5b8a6f4e2d0c8b6a4f2e0d8c6b4a2f0e
app.jwt.expiration-ms=86400000

# Jackson Settings
spring.jackson.serialization.write-dates-as-timestamps=false


